# Microscope Hardware Configuration
# Single source of truth for camera, optics, and stage parameters.
# All code that needs sensor dimensions, pixel sizes, or FOV should
# read from this file rather than using local hardcoded constants.
#
# --- IMPORTANT ---
# If you change cameras or objectives, update this file and restart.
# All derived values (effective_pixel_size_um, fov_mm) are computed
# from these base parameters at load time.

camera:
  # Physical sensor pixel size (manufacturer spec, independent of optics)
  sensor_pixel_size_um: 6.5

  # Sensor dimensions in pixels (active area)
  sensor_width_px: 2048
  sensor_height_px: 2048

  # Acquisition frame rate, in frames/second. This is the standing setting for
  # motion AND acquisition, and it is deliberately NOT scaled by the AOI.
  #
  # z_velocity = z_step * frame_rate with a fixed Z step, so this number is the
  # stage sweep speed. A rolling-shutter sCMOS can physically run ~2x faster at
  # a 1024-row crop, and deriving the rate from that capability (2026-08-07 to
  # 2026-08-09) doubled the sweep to 80 fps whenever the AOI was cropped — the
  # stacks came back blurry and nothing in the UI said the speed had changed.
  # Capability lives in HardwareConfig.max_frame_rate_hz; it must not choose
  # this. An explicitly entered rate still overrides.
  max_frame_rate_hz_full_frame: 40.0

optics:
  # --- FALLBACK ONLY: auto-synced from the microscope on connect ---
  # The objective and tube lens change per objective/project, and the scope
  # reports them in ScopeSettings.txt (downloaded on connect). At runtime,
  # get_hardware_config() OVERLAYS the scope-reported values (and a measured
  # pixel_calibration.json, if present) on top of these. So you normally do
  # NOT need to hand-edit the three values below — they are only used when
  # running disconnected/offline with no ScopeSettings.txt available.
  #
  # NOTE: ScopeSettings.txt reports the SYSTEM magnification in its
  # "Objective lens magnification" field with the tube lens against a 200 mm
  # reference. So for these fallback values, set objective_magnification to the
  # system magnification the scope reports and keep tube == reference (200) to
  # avoid double-counting the tube-lens factor.
  #
  # KEEP THIS IN STEP WITH THE SCOPE. It has been wrong twice, and each time
  # the symptom was geometric rather than obvious: tile spacing computed from
  # one pixel size and stitched with another.
  #   2026-06-19  5.0      a nominal figure, never measured
  #   2026-07-23  6.3254   back-computed from the 2026-06-26 pixel calibration
  #   2026-08-17  6.205    what the scope itself reports (CTLSM1)
  # The 2026-06-26 calibration measured 1.0276 um/px, i.e. ~6.326x -- 1.9% off
  # the scope, and nowhere near the 5.0x the config believed at the time. Its
  # stored optics_signature recorded that stale 5.0, so the guard in
  # config_loader now rejects it on a 19% label mismatch for a 2% real one.
  objective_magnification: 6.205

  # Tube lens design focal length in mm. Keep equal to reference_tube_lens_mm
  # (200) unless a project genuinely changes the tube lens AND the scope reports
  # the bare objective magnification (n7 reports system mag, so leave at 200).
  tube_lens_focal_length_mm: 200.0

  # Reference tube lens focal length (mm): system_mag = objective_mag *
  # (tube_lens / reference_tube_lens). Usually 200mm.
  reference_tube_lens_mm: 200.0

  # Numerical aperture of the detection objective.
  # Used for deconvolution PSF generation and depth-of-field calculations.
  numerical_aperture: 0.4

  # Refractive index of the immersion medium.
  # Common values: 1.0 (air), 1.33 (water), 1.52 (oil)
  immersion_refractive_index: 1.33

  # Camera X axis is inverted relative to stage X axis.
  # Common in light-sheet systems where the camera sees a mirror image.
  # If True, tile data is flipped in X before stitching.
  camera_x_inverted: true

# Laser / illumination channels
# Channel wavelengths used as defaults for per-channel deconvolution.
# The first matching channel wavelength is used if no explicit override.
channel_wavelengths_nm:
  0: 405.0    # DAPI
  1: 488.0    # GFP
  2: 561.0    # RFP
  3: 640.0    # Far-Red

# Stage travel limits (mm and degrees)
# These are safety limits — positions outside these ranges are rejected.
# Set conservatively to prevent hardware collisions.
stage_limits:
  x_min_mm: 0.0
  x_max_mm: 26.0
  y_min_mm: 0.0
  y_max_mm: 26.0
  z_min_mm: 0.0
  z_max_mm: 26.0
  r_min_deg: -720.0
  r_max_deg: 720.0

# ---------------------------------------------------------------------------
# Per-microscope overlays
# ---------------------------------------------------------------------------
# Keyed on the scope's own "Microscope name" from ScopeSettings.txt (matched
# case-insensitively). Deep-merged OVER everything above, before the runtime
# overlays run, so the precedence is:
#
#   pixel_calibration.json  >  ScopeSettings.txt  >  this block  >  the base above
#
# ---- THIS BLOCK MUST STAY LAST IN THE FILE ----
# PixelCalibrationService.apply_config_patch rewrites the FIRST matching
# `key:` line in this file (re.subn with count=1 and re.MULTILINE), and its
# `^\s*` matches INDENTED keys too. So any key repeated here that also exists
# in the base -- objective_magnification, sensor_pixel_size_um,
# tube_lens_focal_length_mm, reference_tube_lens_mm -- would be patched INSTEAD
# of the base if it appeared above it. Pinned by
# tests/test_hardware_config_optics.py::TestYamlOrderingConstraint.
#
# STAGE LIMITS DO NOT BELONG HERE. The only limits that gate a stage move live
# in microscope_settings/{name}_settings.json. The stage_limits block above is
# read by exactly one caller (workflow_controller.py, for a tile-count
# ESTIMATE) and uses a different key shape (x_min_mm vs x.min). A third
# representation of the stage envelope is how they drift apart.
#
# SENSOR DIMENSIONS DO NOT BELONG HERE either: disk_tile_loader freezes
# FRAME_WIDTH/FRAME_HEIGHT from them at import time, so a per-scope sensor size
# would be stale for the rest of the session after a mid-session scope switch.
microscopes:
  # Liara -- high-res ASLM / TSPIM (CTLSM2). Single-sided illumination, no
  # galvo; the light-sheet waist is swept by a voice coil (Thorlabs BLINK)
  # driven by a Moku:Go against an Arduino clock, off-network from this app.
  liara:
    camera:
      # Measured on a real Liara acquisition (Workflow.txt: 11.0 f/s, and
      # `Z stage velocity 0.011 mm/s` = 1 um plane spacing x 11 fps confirms
      # it). NOT a camera-capability figure -- the voice-coil sweep is
      # synchronised to the camera readout by an external clock, so this rate
      # is a contract with hardware we cannot see, not a ceiling to approach.
      max_frame_rate_hz_full_frame: 11.0
    optics:
      # ESPECIAL 23.8x / 0.7 NA dipping detection objective, into an
      # ethyl-cinnamate-class clearing medium (n ~ 1.55).
      numerical_aperture: 0.7
      immersion_refractive_index: 1.55
      # ASSERTION ONLY -- never used as a value, and deliberately NOT
      # `objective_magnification`. The scope always wins (it reports the
      # objective in the same file this overlay is keyed on), so a per-scope
      # `objective_magnification` could never take effect. What this does is
      # make a stale server value VISIBLE: >2% away and get_hardware_config
      # records an optics_disagreement that the app shows on connect.
      #
      # 25.48x = 6.5 um sensor pitch / 0.2551 um/px measured on a calibration
      # standard 2026-08-03. Corroborated by the LOCI courseware, which
      # documents the same objective as "23.8x/0.7 NA ... the ~25x sometimes
      # quoted is the effective magnification once the RI ~ 1.55 clearing
      # medium is accounted for (0.253 um/px, ~518 um field)" -- agreeing to
      # within 0.8%. Liara's server currently still reports a stale 17.
      expected_objective_magnification: 25.48
