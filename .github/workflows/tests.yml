name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite takes about 5 minutes locally; a hung test must not hold the
    # runner for the default 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.10 dropped: requirements.txt pins zarr>=3.1.4 which needs Python>=3.11
        python-version: ["3.11"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Qt's offscreen platform plugin still needs xcb shared libs at runtime
      # on Ubuntu — without these, `from PyQt5.QtWidgets import QApplication`
      # fails with "could not load the Qt platform plugin 'xcb'".
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      # The whole suite under pytest: the pytest-style tests and the
      # unittest.TestCase classes that tests/run_tests.py runs (every one of
      # them is collected here too). Until 2026-11-22 CI ran run_tests.py,
      # which finds only the TestCase classes, about 1000 of 2500 tests.
      # tests/integration is left out: its tests start tests/mock_server.py
      # from a hard-coded developer path and need fixtures it does not
      # define; run_tests.py never collected them either, so no test that CI
      # ran before is dropped.
      - name: Run tests
        run: python -m pytest tests -q --ignore=tests/integration -p no:cacheprovider
